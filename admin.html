<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel ADM — Bolão Bet</title>

    <!-- Ícones para Web e App de Celular -->
    <link rel="icon" type="image/svg+xml" href="icone.svg">
    <link rel="apple-touch-icon" href="icone.svg">

    <!-- Configurações para abrir como App na Tela Inicial (Web App) -->
    <meta name="apple-mobile-web-app-title" content="Bolão ADM">
    <meta name="application-name" content="Bolão ADM">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #38bdf8;
            --accent-green: #22c55e;
            --accent-red: #ef4444;
            --gold: #eab308;
            --border-color: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-color); padding: 20px; display: flex; flex-direction: column; align-items: center; }
        .container { width: 100%; max-width: 1200px; }

        header {
            background: linear-gradient(135deg, #1e293b, #0f172a);
            border: 1px solid var(--accent-color);
            box-shadow: 0 0 15px rgba(56, 189, 248, 0.2);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            margin-bottom: 20px;
        }
        header h1 { color: var(--accent-color); font-size: 1.8rem; margin-bottom: 5px; text-transform: uppercase; }
        header p { color: #94a3b8; font-weight: 600; font-size: 0.9rem; }

        .table-responsive { overflow-x: auto; background-color: var(--card-bg); border-radius: 10px; border: 1px solid var(--border-color); }
        table { width: 100%; border-collapse: collapse; min-width: 950px; }
        th, td { padding: 10px 8px; border: 1px solid var(--border-color); text-align: center; }
        th { background-color: #0f172a; color: var(--accent-color); font-size: 0.85rem; text-transform: uppercase; }

        .tr-placares { background-color: rgba(34, 197, 94, 0.15); border-bottom: 2px solid var(--accent-green); }
        .label-placar { color: var(--accent-green); font-weight: 900; }
        .input-placar { background-color: #06150c !important; border: 1px solid var(--accent-green) !important; color: var(--accent-green) !important; font-weight: bold; text-align: center; }

        .primeiro-lugar { background-color: rgba(234, 179, 8, 0.12) !important; }
        .primeiro-lugar .col-nome { color: var(--gold); font-weight: bold; }
        .badge-lider { background-color: var(--gold); color: #000; font-size: 0.65rem; padding: 2px 6px; border-radius: 10px; margin-left: 6px; font-weight: 900; }

        .col-num { width: 50px; }
        .col-nome { width: 200px; text-align: left; }
        .col-status { width: 110px; }
        .col-jogo { width: 65px; font-family: monospace; font-size: 0.95rem; }
        .col-total { width: 80px; font-weight: 900; color: var(--accent-color); background-color: rgba(56, 189, 248, 0.1); }
        .col-acao { width: 45px; }

        input, select { width: 100%; background-color: #0f172a; border: 1px solid var(--border-color); color: white; padding: 6px; border-radius: 4px; text-align: center; }
        .btn-delete { background: none; border: none; color: var(--accent-red); font-weight: bold; cursor: pointer; font-size: 1.1rem; }
        .btn-delete:hover { transform: scale(1.2); }

        /* Sistema de Cores dos Palpites */
        .acerto-exato { background-color: rgba(34, 197, 94, 0.2) !important; color: var(--accent-green) !important; font-weight: 900; }
        .acerto-parcial { background-color: rgba(234, 179, 8, 0.2) !important; color: var(--gold) !important; font-weight: bold; }
        .erro-jogo { background-color: rgba(239, 68, 68, 0.2) !important; color: var(--accent-red) !important; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>PAINEL ADM — RANKING DO BOLÃO</h1>
        <p>CÁLCULO AUTOMÁTICO DE PONTUAÇÃO E RESULTADOS</p>
    </header>

    <div class="table-responsive">
        <table>
            <thead>
                <!-- Linha dos Resultados Oficiais -->
                <tr class="tr-placares">
                    <th class="col-num">⚽</th>
                    <th class="col-nome label-placar">RESULTADOS OFICIAIS</th>
                    <th class="col-status label-placar">PLACAR</th>
                    <th class="col-jogo"><input type="text" id="placar-0" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(0, this.value)"></th>
                    <th class="col-jogo"><input type="text" id="placar-1" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(1, this.value)"></th>
                    <th class="col-jogo"><input type="text" id="placar-2" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(2, this.value)"></th>
                    <th class="col-jogo"><input type="text" id="placar-3" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(3, this.value)"></th>
                    <th class="col-jogo"><input type="text" id="placar-4" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(4, this.value)"></th>
                    <th class="col-jogo"><input type="text" id="placar-5" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(5, this.value)"></th>
                    <th class="col-jogo"><input type="text" id="placar-6" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(6, this.value)"></th>
                    <th class="col-jogo"><input type="text" id="placar-7" class="input-placar" placeholder="0x0" onchange="atualizarPlacarOficial(7, this.value)"></th>
                    <th class="col-total">--</th>
                    <th class="col-acao"></th>
                </tr>
                <!-- Cabeçalho das Colunas -->
                <tr>
                    <th class="col-num">POS</th>
                    <th class="col-nome">Apostador</th>
                    <th class="col-status">Status</th>
                    <th class="col-jogo">J1</th><th class="col-jogo">J2</th><th class="col-jogo">J3</th><th class="col-jogo">J4</th>
                    <th class="col-jogo">J5</th><th class="col-jogo">J6</th><th class="col-jogo">J7</th><th class="col-jogo">J8</th>
                    <th class="col-total">TOTAL</th>
                    <th class="col-acao"></th>
                </tr>
            </thead>
            <tbody id="tabela-corpo"></tbody>
        </table>
    </div>
</div>

<!-- SDKs do Firebase -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyCxWK8_GMj6K75p3_scifj5w5M42UrizoU",
        authDomain: "bolao-bec5c.firebaseapp.com",
        databaseURL: "https://bolao-bec5c-default-rtdb.firebaseio.com",
        projectId: "bolao-bec5c",
        storageBucket: "bolao-bec5c.firebasestorage.app",
        messagingSenderId: "852932005889",
        appId: "1:852932005889:web:136229dd5162783d963000"
    };

    firebase.initializeApp(firebaseConfig);
    const dbApostadores = firebase.database().ref('bolao_dados');
    const dbPlacares = firebase.database().ref('bolao_placares');

    let apostadoresMap = {};
    let placaresOficiais = ['', '', '', '', '', '', '', ''];

    // Escuta os Resultados Oficiais digitados pelo Admin
    dbPlacares.on('value', (snapshot) => {
        placaresOficiais = snapshot.val() || ['', '', '', '', '', '', '', ''];
        preencherPlacaresOficiaisNaTela();
        renderizarTabela();
    });

    // Escuta em tempo real quando alguém envia palpites pelo index.html
    dbApostadores.on('value', (snapshot) => {
        apostadoresMap = snapshot.val() || {};
        renderizarTabela();
    });

    function preencherPlacaresOficiaisNaTela() {
        placaresOficiais.forEach((p, i) => {
            const el = document.getElementById(`placar-${i}`);
            if (el) el.value = p || '';
        });
    }

    // Regra do Cálculo
    function calcularPontosJogo(palpite, resultadoOficial) {
        if (!palpite || !resultadoOficial) return { pts: 0, tipo: 'sem_resultado' };

        const p = palpite.trim().toLowerCase();
        const r = resultadoOficial.trim().toLowerCase();

        if (!p.includes('x') || !r.includes('x')) return { pts: 0, tipo: 'sem_resultado' };

        const [p1, p2] = p.split('x').map(Number);
        const [r1, r2] = r.split('x').map(Number);

        if (isNaN(p1) || isNaN(p2) || isNaN(r1) || isNaN(r2)) return { pts: 0, tipo: 'sem_resultado' };

        // Placar Exato -> 15 pontos
        if (p1 === r1 && p2 === r2) {
            return { pts: 15, tipo: 'exato' };
        }

        const advPalpite = p1 > p2 ? 1 : (p1 < p2 ? 2 : 0);
        const advResultado = r1 > r2 ? 1 : (r1 < r2 ? 2 : 0);

        // Vencedor ou Empate correto -> 5 pontos
        if (advPalpite === advResultado) {
            return { pts: 5, tipo: 'parcial' };
        }

        // Errou o jogo -> 0 pontos
        return { pts: 0, tipo: 'erro' };
    }

    function renderizarTabela() {
        const tbody = document.getElementById('tabela-corpo');
        tbody.innerHTML = '';

        let lista = Object.keys(apostadoresMap)
            .map(key => {
                const p = apostadoresMap[key];
                
                let palpites = [];
                if (Array.isArray(p.palpites)) {
                    palpites = p.palpites;
                } else if (p.palpites && typeof p.palpites === 'object') {
                    palpites = Object.values(p.palpites);
                } else {
                    palpites = ['', '', '', '', '', '', '', ''];
                }
                
                let total = 0;
                palpites.forEach((palpite, i) => {
                    total += calcularPontosJogo(palpite, placaresOficiais[i]).pts;
                });

                return { id: key, ...p, palpitesArr: palpites, totalPontos: total };
            })
            .filter(p => p.nome && p.nome.trim() !== '');

        lista.sort((a, b) => {
            if (b.totalPontos !== a.totalPontos) {
                return b.totalPontos - a.totalPontos;
            }
            return (a.nome || '').localeCompare(b.nome || '');
        });

        lista.forEach((p, index) => {
            const ehLider = index === 0 && p.totalPontos > 0;

            const colunasJogos = Array.from({ length: 8 }).map((_, jIndex) => {
                const palpite = p.palpitesArr[jIndex] || '';
                const res = calcularPontosJogo(palpite, placaresOficiais[jIndex]);
                
                let classeEstilo = '';
                if (res.tipo === 'exato') classeEstilo = 'acerto-exato';
                else if (res.tipo === 'parcial') classeEstilo = 'acerto-parcial';
                else if (res.tipo === 'erro') classeEstilo = 'erro-jogo';

                return `<td class="col-jogo ${classeEstilo}">${palpite || '-'}</td>`;
            }).join('');

            let tr = document.createElement('tr');
            if (ehLider) tr.className = 'primeiro-lugar';

            tr.innerHTML = `
                <td class="col-num">${index + 1}º</td>
                <td class="col-nome">
                    ${p.nome}
                    ${ehLider ? '<span class="badge-lider">LÍDER</span>' : ''}
                </td>
                <td class="col-status">
                    <select onchange="atualizarStatus('${p.id}', this.value)">
                        <option value="Pendente" ${p.status === 'Pendente' ? 'selected' : ''}>Pendente</option>
                        <option value="Pago" ${p.status === 'Pago' ? 'selected' : ''}>Pago</option>
                    </select>
                </td>
                ${colunasJogos}
                <td class="col-total">${p.totalPontos} pts</td>
                <td class="col-acao">
                    <button class="btn-delete" onclick="removerApostador('${p.id}')">✕</button>
                </td>
            `;
            tbody.appendChild(tr);
        });
    }

    function atualizarPlacarOficial(jIndex, valor) {
        placaresOficiais[jIndex] = valor.trim();
        dbPlacares.set(placaresOficiais);
    }

    function atualizarStatus(id, valor) {
        dbApostadores.child(id).update({ status: valor });
    }

    function removerApostador(id) {
        if (confirm("Deseja apagar esta aposta do banco de dados?")) {
            dbApostadores.child(id).remove();
        }
    }
</script>
</body>
</html>
